name: Daily Fiber Briefing

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每天执行
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      SITE_BASE: https://tfhuaxuepin.github.io/fiber-briefing
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Checkout gh-pages history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true

      - name: Build daily briefing (采集 + DeepSeek 整合)
        run: node scripts/build_briefing.js
        env:
          TZ: Asia/Shanghai

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: 'briefing update ${{ github.run_id }}'

      - name: WeChat push via ServerChan (微信推送)
        run: node scripts/notify.js
        continue-on-error: true
