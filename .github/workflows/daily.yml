name: Daily Fiber Briefing

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，周一~周六执行（UTC 的 1-6 即北京的周一到周六）
    # 周日休刊（2026-09-19 用户决定）：CCF 日报周末不更新，且周日无法续期 Cookie
    # （CCF 登录受 IP 报备白名单限制，周末不在办公室网络）
    - cron: '0 1 * * 1-6'
  workflow_dispatch:
    inputs:
      skip_dingtalk:
        description: '跳过钉钉推送（测试用，不打扰群成员）'
        type: boolean
        default: false
      repush:
        description: '仅补发推送（不重新构建、不调用大模型）：填日期如 2026-09-23；留空则正常构建'
        type: string
        default: ''
      skip_wechat:
        description: '跳过微信推送（与 repush 搭配，可只补钉钉）'
        type: boolean
        default: false

permissions:
  contents: write

# 并发锁：防止 GitHub 延迟触发的重复运行导致重复推送
concurrency:
  group: daily-briefing
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # 单次请求超时 5 分钟、最多 2 轮，避免网关抖动直接降级为标题列表（最坏 10 分钟）
      LLM_TIMEOUT_MS: '300000'
      LLM_MAX_ROUNDS: '3'
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      CCF_USERNAME: ${{ secrets.CCF_USERNAME }}
      CCF_PASSWORD: ${{ secrets.CCF_PASSWORD }}
      # 选填逃生通道：账号密码登录被目标站风控拦截时，临时填浏览器里已登录的 Cookie 串顶替
      CCF_COOKIE: ${{ secrets.CCF_COOKIE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      # 留空即走「自定义关键词」模式；若机器人改为「加签」安全设置，补回该 Secret 即可
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      DINGTALK_AT_MOBILES: ${{ secrets.DINGTALK_AT_MOBILES }}
      DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
      DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
      DINGTALK_ROBOT_CODE: ${{ secrets.DINGTALK_ROBOT_CODE }}
      DINGTALK_USER_IDS: ${{ secrets.DINGTALK_USER_IDS }}
      SITE_BASE: https://tfhuaxuepin.github.io/fiber-briefing
      # 手动触发时若勾选 skip_dingtalk，则只构建发布、不发钉钉（定时任务恒为空＝正常推送）
      SKIP_DINGTALK: ${{ inputs.skip_dingtalk && '1' || '' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 休刊日闸门（2026-09-24 上线）：命中 config/off_days.json 的日期 → SKIP_TODAY=1，
      # 后续构建、发布、推送全部跳过。长假（中秋/国庆）里 CCF 停更、Cookie 过期、
      # LLM 配额受限，照常运行只会产出低质量降级版——宁可休刊，不发烂稿。
      # 手动 repush 补推不受此限（假期里可用它补发最后一期完整简报）。
      - name: Holiday guard (休刊日检查)
        if: ${{ !inputs.repush }}
        run: node scripts/off_day_guard.js
        env:
          TZ: Asia/Shanghai

      - name: Install dependencies
        if: ${{ env.SKIP_TODAY != '1' }}
        run: npm install

      # 补推模式也必须拉 gh-pages：notify_from_site.js 要从 site/<date>.html 反推推送内容
      # （2026-10-07 修复：此前该步骤在 repush 下被跳过，导致补推恒失败「找不到当日页面」）
      - name: Checkout gh-pages history
        if: ${{ env.SKIP_TODAY != '1' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true

      # 推送幂等守护（2026-10-07）：本次运行「开始前」今天的页面若已存在，
      # 说明当天的发布与微信推送已由更早的运行（本地 08:40 总结流程那次 dispatch）完成。
      # 此时定时任务只做补位：若今日尚无页面则正常构建+推送；已有则跳过微信推送，避免重复打扰。
      # 手动 dispatch 不受此限（手动重跑通常就是要重发），repush 补推更是明确要发。
      - name: Check if today already published (推送幂等检查)
        id: pub
        if: ${{ !inputs.repush && env.SKIP_TODAY != '1' }}
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          if [ -f "site/$D.html" ]; then echo "already=yes"; else echo "already=no"; fi
          if [ -f "site/$D.html" ]; then echo "already=yes" >> "$GITHUB_OUTPUT"; else echo "already=no" >> "$GITHUB_OUTPUT"; fi

      - name: Build daily briefing (采集 + DeepSeek 整合)
        if: ${{ !inputs.repush && env.SKIP_TODAY != '1' }}
        run: node scripts/build_briefing.js
        env:
          TZ: Asia/Shanghai

      - name: Deploy to GitHub Pages
        if: ${{ !inputs.repush && env.SKIP_TODAY != '1' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: 'briefing update ${{ github.run_id }}'

      # 仅补推模式（repush 填了日期时）：不重新构建、不调用大模型，
      # 直接从刚拉下来的 gh-pages 页面反推推送内容。用于某天漏推时补发，
      # 因不写任何页面文件，绝无覆盖风险。
      - name: Prepare push payload from published page (补推模式)
        if: ${{ inputs.repush }}
        run: node scripts/notify_from_site.js ${{ inputs.repush }}
        env:
          TZ: Asia/Shanghai

      # 定时任务（schedule）只在「今日页面此前尚未发布」时推送微信，避免与本地流程的推送重复；
      # 手动 dispatch / repush 一律照常推送
      - name: WeChat push via ServerChan (微信推送)
        if: ${{ !inputs.skip_wechat && env.SKIP_TODAY != '1' && (github.event_name != 'schedule' || steps.pub.outputs.already != 'yes') }}
        run: node scripts/notify.js
        continue-on-error: true

      # 钉钉幂等守护（2026-10-07）：钉钉由云端 09:00 定时任务负责推送（本地流程只推微信），
      # 若当天已被更早的运行推过（例如 09:00 延迟、先用 repush 补过），定时任务不应再推一次到群。
      # 状态记录在主分支 state/dingtalk_last.txt（内容＝最后成功推送的日期）。
      # 与微信同理：只在 schedule 事件生效，手动 dispatch / repush 不受限（手动＝明确要发）。
      - name: Check DingTalk already sent (钉钉幂等检查)
        id: dt
        if: ${{ env.SKIP_TODAY != '1' }}
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          LAST=""
          if [ -f "state/dingtalk_last.txt" ]; then LAST=$(tr -d ' \r\n' < state/dingtalk_last.txt); fi
          echo "last=[$LAST] today=[$D]"
          if [ "$LAST" = "$D" ]; then echo "sent=yes" >> "$GITHUB_OUTPUT"; else echo "sent=no" >> "$GITHUB_OUTPUT"; fi

      - name: DingTalk push (钉钉推送)
        id: dingtalk
        if: ${{ env.SKIP_TODAY != '1' && (github.event_name != 'schedule' || steps.dt.outputs.sent != 'yes') }}
        run: node scripts/notify_dingtalk.js
        continue-on-error: true

      # 记录钉钉已推（供后续 schedule run 判重）；仅当确实执行且未被 SKIP_DINGTALK 测试开关跳过时记录
      - name: Mark DingTalk sent (记录钉钉已推)
        if: ${{ env.SKIP_TODAY != '1' && env.SKIP_DINGTALK != '1' && steps.dingtalk.outcome == 'success' }}
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          mkdir -p state
          echo "$D" > state/dingtalk_last.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/dingtalk_last.txt
          if git diff --cached --quiet; then echo "state unchanged"; else git commit -m "chore(state): dingtalk sent $D"; git push; fi
        continue-on-error: true

      # 失败告警：前面任一步骤失败时推一条微信，避免「早上没收到简报却没人知道」
      - name: Failure alert (失败告警)
        if: failure()
        run: node scripts/notify_failure.js
        continue-on-error: true
        env:
          FAIL_STEP: ${{ github.job }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
