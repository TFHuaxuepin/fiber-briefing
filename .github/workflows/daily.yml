name: Daily Fiber Briefing

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，周一~周六执行（UTC 的 1-6 即北京的周一到周六）
    # 周日休刊（2026-09-19 用户决定）：CCF 日报周末不更新，且周日无法续期 Cookie
    # （CCF 登录受 IP 报备白名单限制，周末不在办公室网络）
    - cron: '0 1 * * 1-6'
  workflow_dispatch:
    inputs:
      skip_dingtalk:
        description: '跳过钉钉推送（测试用，不打扰群成员）'
        type: boolean
        default: false
      repush:
        description: '仅补发推送（不重新构建、不调用大模型）：填日期如 2026-09-23；留空则正常构建'
        type: string
        default: ''
      skip_wechat:
        description: '跳过微信推送（与 repush 搭配，可只补钉钉）'
        type: boolean
        default: false

permissions:
  contents: write

# 并发锁：防止 GitHub 延迟触发的重复运行导致重复推送
concurrency:
  group: daily-briefing
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # 单次请求超时 5 分钟、最多 2 轮，避免网关抖动直接降级为标题列表（最坏 10 分钟）
      LLM_TIMEOUT_MS: '300000'
      LLM_MAX_ROUNDS: '3'
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      CCF_USERNAME: ${{ secrets.CCF_USERNAME }}
      CCF_PASSWORD: ${{ secrets.CCF_PASSWORD }}
      # 选填逃生通道：账号密码登录被目标站风控拦截时，临时填浏览器里已登录的 Cookie 串顶替
      CCF_COOKIE: ${{ secrets.CCF_COOKIE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      # 留空即走「自定义关键词」模式；若机器人改为「加签」安全设置，补回该 Secret 即可
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      DINGTALK_AT_MOBILES: ${{ secrets.DINGTALK_AT_MOBILES }}
      DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
      DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
      DINGTALK_ROBOT_CODE: ${{ secrets.DINGTALK_ROBOT_CODE }}
      DINGTALK_USER_IDS: ${{ secrets.DINGTALK_USER_IDS }}
      SITE_BASE: https://tfhuaxuepin.github.io/fiber-briefing
      # 手动触发时若勾选 skip_dingtalk，则只构建发布、不发钉钉（定时任务恒为空＝正常推送）
      SKIP_DINGTALK: ${{ inputs.skip_dingtalk && '1' || '' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 休刊日闸门（2026-09-24 上线）：命中 config/off_days.json 的日期 → SKIP_TODAY=1，
      # 后续构建、发布、推送全部跳过。长假（中秋/国庆）里 CCF 停更、Cookie 过期、
      # LLM 配额受限，照常运行只会产出低质量降级版——宁可休刊，不发烂稿。
      # 手动 repush 补推不受此限（假期里可用它补发最后一期完整简报）。
      - name: Holiday guard (休刊日检查)
        if: ${{ !inputs.repush }}
        run: node scripts/off_day_guard.js
        env:
          TZ: Asia/Shanghai

      - name: Install dependencies
        if: ${{ env.SKIP_TODAY != '1' }}
        run: npm install

      - name: Checkout gh-pages history
        if: ${{ !inputs.repush && env.SKIP_TODAY != '1' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true

      - name: Build daily briefing (采集 + DeepSeek 整合)
        if: ${{ !inputs.repush && env.SKIP_TODAY != '1' }}
        run: node scripts/build_briefing.js
        env:
          TZ: Asia/Shanghai

      - name: Deploy to GitHub Pages
        if: ${{ !inputs.repush && env.SKIP_TODAY != '1' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: 'briefing update ${{ github.run_id }}'

      # 仅补推模式（repush 填了日期时）：不重新构建、不调用大模型，
      # 直接从刚拉下来的 gh-pages 页面反推推送内容。用于某天漏推时补发，
      # 因不写任何页面文件，绝无覆盖风险。
      - name: Prepare push payload from published page (补推模式)
        if: ${{ inputs.repush }}
        run: node scripts/notify_from_site.js ${{ inputs.repush }}
        env:
          TZ: Asia/Shanghai

      - name: WeChat push via ServerChan (微信推送)
        if: ${{ !inputs.skip_wechat && env.SKIP_TODAY != '1' }}
        run: node scripts/notify.js
        continue-on-error: true

      - name: DingTalk push (钉钉推送)
        if: ${{ env.SKIP_TODAY != '1' }}
        run: node scripts/notify_dingtalk.js
        continue-on-error: true

      # 失败告警：前面任一步骤失败时推一条微信，避免「早上没收到简报却没人知道」
      - name: Failure alert (失败告警)
        if: failure()
        run: node scripts/notify_failure.js
        continue-on-error: true
        env:
          FAIL_STEP: ${{ github.job }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
